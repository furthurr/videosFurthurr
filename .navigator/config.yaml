version: 1
project:
  name: "furthurr-videos"
  root: .
layers:
  context: true
  module_map: true
  symbols: false
  graph: false
sources:
  detect_external: true
  export_agents_md: false
graph:
  provider: none
  path: graph/graph.json
exclude:
  - node_modules/**
  - .git/**
  - dist/**
  - build/**
  - .navigator/cache/**
  - "**/.env"
  - "**/.env.*"
  - "**/secrets/**"
update:
  strategy: manual
